
[package]
name = "hermes"
version = "0.0.0-development"
edition = "2024"

[package.metadata.precommit]
fmt = "cargo fmt && { git diff --cached --name-only --diff-filter=ACM | while IFS= read -r f; do git add \"$f\"; done; true; }"

[features]
default = []
with-icons = []

[workspace]
members = [".", "tests/e2e", "tests/integration"]
resolver = "2"

[workspace.metadata.precommit]
fmt = "cargo fmt && { git diff --cached --name-only --diff-filter=ACM | while IFS= read -r f; do git add \"$f\"; done; true; }"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
agent-client-protocol = { version = "2.0.0", features = [
    "unstable_session_fork",
    "unstable_mcp_over_acp",
    "unstable_auth_methods",
    "unstable_elicitation",
    # "unstable_boolean_config",
    # "unstable_llm_providers",
    # "unstable_nes",
] }
async-channel = "2"
async-io = "2"
async-lock = "3"
async-net = "2"
async-process = "2"
async-tungstenite = { version = "0.35", default-features = false, features = ["smol-runtime", "futures-rustls-webpki-roots"] }
async-trait = "0.1"
blocking = "1"
crossbeam-channel = "0.5.15"
event-listener = "5"
futures = "0.3"
futures-lite = "2"
mlua = { version = "0.10", features = ["module"] }
nvim-oxi = { version = "0.6.0", features = ["neovim-0-11", "libuv", "mlua"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smol = "2"
strip-ansi-escapes = "0.2"
tar = "0.4"
tracing = "0.1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
flate2 = "1"
zip = { version = "8", default-features = false, features = ["deflate"] }
tracing-subscriber = { version = "0.3.0", features = ["json", "env-filter"] }
uuid = { version = "1.22.0", features = ["v4"] }
resvg = "0.48"
tiny-skia = "0.12"
usvg = "0.48"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
nvim-oxi = { version = "0.6.0", features = ["test", "neovim-0-11"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
serde_json = "1.0"
resvg = "0.48"
tiny-skia = "0.12"
usvg = "0.48"


zip = { version = "8", default-features = false, features = ["deflate"] }
# panic = "abort" removed - errors are logged and Ok returned instead

[dev-dependencies]
cargo-sort = "2.1.4"
pre-commit-hooks = "0.3.0"
pretty_assertions = "1.4"
proptest = "1.10.0"
tempfile = "3.14"

[profile.dev]
opt-level = 0
debug = 1
lto = false
codegen-units = 256

[profile.test]
opt-level = 0
debug = 1
lto = false
codegen-units = 256

[profile.release]

