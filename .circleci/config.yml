version: 2.1

orbs:
  windows: circleci/windows@5.1.1
  rust: circleci/rust@2.0.0

  node: circleci/node@7.2.1

#-----------------------------------------------------------------------------------------------------------------------------

executors:
  node:
    docker:
      - image: node:24.21.0
  mac-aarch64:
    resource_class: macos.m1.medium.gen1 
    macos:
      xcode: 26.3.0
  rust-linux-x86_64:
    docker:
      - image: cimg/rust:1.98.1
    resource_class: large
    environment:
      PIPELINE_NUM: << pipeline.number >>
      TZ: "America/Los_Angeles"
  rust-linux-aarch64:
    docker:
      - image: cimg/rust:1.98.1
    resource_class: arm.medium
    environment:
      PIPELINE_NUM: << pipeline.number >>
      TZ: "America/Los_Angeles"
  ubuntu:
    resource_class: large
    environment:
      PIPELINE_NUM: << pipeline.number >>
      TZ: "America/Los_Angeles"
    machine:
      image: ubuntu-2204:2025.09.1
      docker_layer_caching: true

#-----------------------------------------------------------------------------------------------------------------------------

workflows:
  ci_cd:
    jobs:
      - check_formatting
      - lua_tests_0_12:
          requires:
            - fetch-registry
      - lua_tests_0_11:
          requires:
            - fetch-registry
      - check_license:
          requires:
            - fetch-registry
      - fetch-registry
      - integration_tests:
          requires:
            - fetch-registry
      - unit_tests:
          requires:
            - fetch-registry
      - e2e_tests_0_12:
          requires:
            - fetch-registry
      - e2e_tests_0_11:
          requires:
            - fetch-registry
      - update-cargo-version:
          filters:
            branches:
              only: 
                - main
                - development
      - build-linux-x86_64:
          filters:
            branches:
              only:
                - main
                - development
          requires:
            - update-cargo-version
            - fetch-registry
      - build-linux-aarch64:
          filters:
            branches:
              only:
                - main
                - development
          requires:
            - update-cargo-version
            - fetch-registry
      - build-mac-aarch64:
          filters:
            branches:
              only:
                - main
                - development
          requires:
            - update-cargo-version
            - fetch-registry
      - build-mac-x86_64:
          filters:
            branches:
              only:
                - main
                - development
          requires:
            - update-cargo-version
            - fetch-registry
      - build-windows-x86_64:
          filters:
            branches:
              only:
                - main
                - development
          requires:
            - update-cargo-version
            - fetch-registry

      - generate-hashes:
          filters:
            branches:
              only:
                - main
          requires:
            - build-linux-x86_64
            - build-linux-aarch64
            - build-mac-aarch64
            - build-mac-x86_64
            - build-windows-x86_64

      - release:
          filters:
            branches:
              only: 
                - main
                - development
          requires:
            - check_formatting
            - lua_tests_0_12
            - lua_tests_0_11
            - check_license
            - integration_tests
            - unit_tests
            - e2e_tests_0_12
            - e2e_tests_0_11
            - generate-hashes

      - publish-luarocks:
          filters:
            branches:
              only:
                - main
          requires:
            - release



#-----------------------------------------------------------------------------------------------------------------------------

commands:
  check-release-needed:
    steps:
      - run:
          name: Check if release needed
          command: |
            if [ ! -s version.txt ]; then
              echo "No release version detected, skipping build"
              circleci-agent step halt
            fi

  check-release-needed-windows:
    steps:
      - run:
          name: Check if release needed
          command: |
            if (-not (Test-Path "version.txt") -or ((Get-Item "version.txt").Length -eq 0)) {
              Write-Output "No release version detected, skipping build"
              circleci-agent step halt
            }


  upload-coverage:
    description: Upload a coverage report to Codecov using the CLI
    parameters:
      file:
        type: string
        description: Path to the coverage report file
    steps:
      - run:
          name: Upload coverage to Codecov
          command: |
            curl -Os https://cli.codecov.io/v10.2.1/linux/codecov
            chmod +x codecov
            ./codecov upload-coverage --file << parameters.file >> --disable-search --fail-on-error

  restore-cargo-cache:
    steps:
      - restore_cache:
          keys:
            - v1-cargo-{{ arch }}-{{ checksum "Cargo.lock" }}
            - v1-cargo-{{ arch }}-

  save-cargo-cache:
    steps:
      - save_cache:
          key: v1-cargo-{{ arch }}-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.cargo/registry/index
            - ~/.cargo/registry/cache
            - ~/.cargo/git/db
            - ~/.cargo/bin
            - ~/.cargo/.crates.toml
            - ~/.cargo/.crates2.json

jobs:
  update-cargo-version:
    executor: node
    steps:
      - checkout
      - rust/install
      - run:
          name: Install cargo edit
          command: cargo install cargo-edit
      - run:
          name: Install pnpm package manager
          command: npm install -g pnpm
      - run:
          name: Install
          command: pnpm install --frozen-lockfile
      - run:
          name: Update Cargo.toml version
          command: |
            node .circleci/get-next-version.mjs > version.txt
            NEXT_VERSION=$(tail -n1 version.txt)
            if [ -n "$NEXT_VERSION" ]; then
              echo "Next version: $NEXT_VERSION"
              cargo set-version "$NEXT_VERSION"
              echo "Updated Cargo.toml with version $NEXT_VERSION"
            fi
      - persist_to_workspace:
          root: .
          paths:
            - version.txt
            - Cargo.toml
            - Cargo.lock

  release:
    executor: node
    environment:
      CIRCLE_PR_NUMBER: ""
      CIRCLE_PULL_REQUEST: ""
      CI_PULL_REQUEST: ""
    steps:
      - checkout
      - run:
          name: Install pnpm package manager
          command: npm install -g pnpm
      - run:
          name: Install
          command: pnpm install --frozen-lockfile
      - attach_workspace:
          at: target/release
      - run:
          name: Prepare hash update
          command: |
            if [ -f target/release/sources.json ]; then
              cp target/release/sources.json nix/sources.json
              git remote set-url origin "https://x-access-token:${GITHUB_WRITE_TOKEN}@github.com/Ruddickmg/hermes.nvim.git"
            fi
      - run:
          name: Semantic release
          command: pnpm release

  publish-luarocks:
    executor: node
    steps:
      - checkout
      - attach_workspace:
          at: target/release
      - run:
          name: Publish to LuaRocks
          command: bash .circleci/publish-luarocks.sh

  generate-hashes:
    docker:
      - image: nixos/nix
    steps:
      - checkout
      - attach_workspace:
          at: target/release
      - run:
          name: Install dependencies
          command: |
            nix-channel --update
            nix-env -iA nixpkgs.gitMinimal nixpkgs.jq nixpkgs.gawk
      - run:
          name: Generate hashes
          command: bash .circleci/generate-hashes.sh
      - persist_to_workspace:
          root: target/release
          paths:
            - checksums.txt
            - sources.json

  check_license:
    executor: rust-linux-x86_64
    steps:
      - checkout
      - attach_workspace:
          at: .
      - restore-cargo-cache
      - run:
          name: Install cargo-deny
          command: command -v cargo-deny &> /dev/null || cargo install --locked cargo-deny
      - run:
          name: Check for license
          command: cargo deny check licenses

  fetch-registry:
    executor: rust-linux-x86_64
    steps:
      - checkout
      - restore-cargo-cache
      - run:
          name: Download ACP Agent Registry
          command: |
            mkdir -p src/acp/registry
            curl -fsSL https://cdn.agentclientprotocol.com/registry/v1/latest/registry.json \
              -o src/acp/registry/registry.json
      - run:
          name: Fetch Cargo dependencies
          command: cargo fetch
      - save-cargo-cache
      - persist_to_workspace:
          root: .
          paths:
            - src/acp/registry/registry.json

  build-linux-x86_64:
    executor: rust-linux-x86_64
    steps:
      - checkout
      - attach_workspace:
          at: .
      - check-release-needed
      - restore-cargo-cache
      - run:
          name: Build for x86_64
          command: cargo build --release --features with-icons
      - run:
          name: Rename binary
          command: mv target/release/libhermes.so target/release/libhermes-linux-x86_64.so
      - persist_to_workspace:
          root: target/release
          paths:
            - libhermes-linux-x86_64.so

  build-linux-aarch64:
    executor: rust-linux-aarch64
    steps:
      - checkout
      - attach_workspace:
          at: .
      - check-release-needed
      - restore-cargo-cache
      - run:
          name: Build for aarch64
          command: cargo build --release --features with-icons
      - save-cargo-cache
      - run:
          name: Rename binary
          command: mv target/release/libhermes.so target/release/libhermes-linux-aarch64.so
      - persist_to_workspace:
          root: target/release
          paths:
            - libhermes-linux-aarch64.so

  build-mac-aarch64:
    executor: mac-aarch64
    steps:
      - checkout
      - attach_workspace:
          at: .
      - check-release-needed
      - run:
          name: Install Rust
          command: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      - run:
          name: Build for aarch64
          command: cargo build --release --features with-icons
      - run:
          name: Rename binary
          command: mv target/release/libhermes.dylib target/release/libhermes-macos-aarch64.dylib
      - persist_to_workspace:
          root: target/release
          paths:
            - libhermes-macos-aarch64.dylib

  build-mac-x86_64:
    executor: mac-aarch64
    steps:
      - checkout
      - attach_workspace:
          at: .
      - check-release-needed
      - run:
          name: Install Rosetta 2
          command: softwareupdate --install-rosetta --agree-to-license
      - run:
          name: Install Rust
          command: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      - run:
          name: Install x86_64 target
          command: rustup target add x86_64-apple-darwin
      - run:
          name: Build for x86_64 (cross-compile)
          command: cargo build --release --features with-icons --target x86_64-apple-darwin
      - run:
          name: Rename binary
          command: mv target/release/libhermes.dylib target/release/libhermes-macos-x86_64.dylib 2>/dev/null || mv target/x86_64-apple-darwin/release/libhermes.dylib target/release/libhermes-macos-x86_64.dylib
      - persist_to_workspace:
          root: target/release
          paths:
            - libhermes-macos-x86_64.dylib
  
  build-windows-x86_64:
    executor: windows/default
    steps:
      - checkout
      - attach_workspace:
          at: .
      - check-release-needed-windows
      - run:
          name: Install Rust (MSVC)
          command: |
            choco install rustup.install -y
            refreshenv
            $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
            rustup --version
            rustup toolchain install stable-x86_64-pc-windows-msvc
            rustup default stable-x86_64-pc-windows-msvc
            rustup target add x86_64-pc-windows-msvc
            rustc -vV
      - run:
          name: Build for Windows x86_64
          command: |
            $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
            cargo build --release --features with-icons --target x86_64-pc-windows-msvc
      - run:
          name: Rename DLL
          command: |
            $dllPath = "target/x86_64-pc-windows-msvc/release/hermes.dll"
            if (Test-Path $dllPath) {
                Move-Item $dllPath "target/x86_64-pc-windows-msvc/release/libhermes-windows-x86_64.dll"
            } else {
                Write-Error "DLL not found at expected path"
                exit 1
            }
      - persist_to_workspace:
          root: target/x86_64-pc-windows-msvc/release
          paths:
            - libhermes-windows-x86_64.dll

  check_formatting:
    executor: rust-linux-x86_64
    steps:
      - checkout
      - restore-cargo-cache
      - run:
          name: Check Rust formatting
          command: cargo fmt -- --check
      - run:
          name: Install Lua tooling
          command: |
            # Install selene for Lua linting
            command -v selene &> /dev/null || cargo install selene --locked
      - run:
          name: Lint Lua code
          command: |
            selene --config selene.toml lua/ tests/lua/spec/

  unit_tests:
    environment:
      CARGO_TARGET_DIR: target
    executor: ubuntu
    steps:
      - checkout
      - attach_workspace:
          at: .
      - restore-cargo-cache
      - rust/install
      - run:
          name: Install coverage tool
          command: |
            cargo install cargo-llvm-cov@0.6.13
            cargo install cargo-nextest --locked
      - run:
          name: Run unit tests
          command: cargo llvm-cov nextest --package hermes --bins --lib --all-features --lcov --output-path unit.coverage.info --ignore-filename-regex 'tests/.*'
      - upload-coverage:
          file: unit.coverage.info

  integration_tests:
    environment:
      CARGO_TARGET_DIR: target
      NEOVIM_VERSION: 0.12.2
      TERM: xterm-256color
      LANG: en_US.UTF-8
    executor: ubuntu
    steps:
      - checkout
      - attach_workspace:
          at: .
      - restore-cargo-cache
      - rust/install
      - run:
          name: Install Neovim from tarball
          command: |
            curl -LO https://github.com/neovim/neovim/releases/download/v${NEOVIM_VERSION}/nvim-linux-x86_64.tar.gz
            tar xzf nvim-linux-x86_64.tar.gz
            sudo mv nvim-linux-x86_64 /opt/nvim
            sudo ln -sf /opt/nvim/bin/nvim /usr/local/bin/nvim
            nvim --version
      - run:
          name: Install coverage tools
          command: |
            cargo install cargo-llvm-cov@0.6.13
            cargo install cargo-nextest --locked
      - run:
          name: Run integration tests
          command: |
            eval "$(cargo llvm-cov show-env --export-prefix)"
            cargo llvm-cov clean --workspace
            cargo build --all-features --package hermes-integration
            cargo nextest run --package hermes-integration --all-features
            cargo llvm-cov report --lcov --output-path integration.coverage.info --ignore-filename-regex 'tests/.*'
      - upload-coverage:
          file: integration.coverage.info

  e2e_tests_0_12:
    environment:
      CARGO_TARGET_DIR: target
      NEOVIM_VERSION: 0.12.2
      TERM: xterm-256color
      LANG: en_US.UTF-8
    executor: ubuntu
    steps:
      - checkout
      - attach_workspace:
          at: .
      - restore-cargo-cache
      - rust/install
      - run:
          name: Install Neovim from tarball
          command: |
            curl -LO https://github.com/neovim/neovim/releases/download/v${NEOVIM_VERSION}/nvim-linux-x86_64.tar.gz
            tar xzf nvim-linux-x86_64.tar.gz
            sudo mv nvim-linux-x86_64 /opt/nvim
            sudo ln -sf /opt/nvim/bin/nvim /usr/local/bin/nvim
            nvim --version
      - run:
          name: Install coverage tools
          command: |
            cargo install cargo-llvm-cov@0.6.13
            cargo install cargo-nextest --locked
      - run:
          name: Install Opencode
          command: curl -fsSL https://opencode.ai/install | bash
      - run:
          name: Install GitHub Copilot
          command: curl -fsSL https://gh.io/copilot-install | bash
      - run:
          name: Run e2e tests (0.12)
          command: |
            export PATH="/home/circleci/.local/bin:$PATH"
            eval "$(cargo llvm-cov show-env --export-prefix)"
            cargo llvm-cov clean --workspace
            cargo nextest run --package hermes-e2e --all-features --no-capture
            cargo llvm-cov report --lcov --output-path e2e.coverage.info --ignore-filename-regex 'tests/.*'
      - upload-coverage:
          file: e2e.coverage.info

  e2e_tests_0_11:
    environment:
      CARGO_TARGET_DIR: target
      NEOVIM_VERSION: 0.11.6
      TERM: xterm-256color
      LANG: en_US.UTF-8
    executor: ubuntu
    steps:
      - checkout
      - attach_workspace:
          at: .
      - restore-cargo-cache
      - rust/install
      - run:
          name: Install Neovim from tarball
          command: |
            curl -LO https://github.com/neovim/neovim/releases/download/v${NEOVIM_VERSION}/nvim-linux-x86_64.tar.gz
            tar xzf nvim-linux-x86_64.tar.gz
            sudo mv nvim-linux-x86_64 /opt/nvim
            sudo ln -sf /opt/nvim/bin/nvim /usr/local/bin/nvim
            nvim --version
      - run:
          name: Install cargo-nextest
          command: cargo install cargo-nextest --locked
      - run:
          name: Install Opencode
          command: curl -fsSL https://opencode.ai/install | bash
      - run:
          name: Install GitHub Copilot
          command: curl -fsSL https://gh.io/copilot-install | bash
      - run:
          name: Run e2e tests (0.11)
          command: |
            export PATH="/home/circleci/.local/bin:$PATH"
            cargo nextest run --package hermes-e2e --all-features --no-capture

  lua_tests_0_12:
    environment:
      NEOVIM_VERSION: 0.12.2
      TERM: xterm-256color
      LANG: en_US.UTF-8
    executor: ubuntu
    steps:
      - checkout
      - attach_workspace:
          at: .
      - restore-cargo-cache
      - rust/install
      - run:
          name: Install Neovim from tarball
          command: |
            curl -LO https://github.com/neovim/neovim/releases/download/v${NEOVIM_VERSION}/nvim-linux-x86_64.tar.gz
            tar xzf nvim-linux-x86_64.tar.gz
            sudo mv nvim-linux-x86_64 /opt/nvim
            sudo ln -sf /opt/nvim/bin/nvim /usr/local/bin/nvim
            nvim --version
      - run:
          name: Build Hermes binary
          command: cargo build --release
      - run:
          name: Install Opencode
          command: curl -fsSL https://opencode.ai/install | bash
      - run:
          name: Install GitHub Copilot
          command: curl -fsSL https://gh.io/copilot-install | bash
      - run:
          name: Install Lua tools
          command: |
            # Install luarocks
            sudo apt-get update
            sudo apt-get install -y lua5.1 liblua5.1-dev

            wget https://luarocks.org/releases/luarocks-3.9.2.tar.gz
            tar zxpf luarocks-3.9.2.tar.gz
            cd luarocks-3.9.2
            ./configure && make && sudo make install

            # Install vusted for testing and luacov-reporter-lcov for coverage
            eval $(luarocks path --lua-version 5.1 --bin)
            luarocks --lua-version=5.1 install vusted --local
            luarocks --lua-version=5.1 install luacov --local
            luarocks --lua-version=5.1 install luacov-reporter-lcov --local
      - run:
          name: Run Lua tests with coverage
          command: |
            eval $(luarocks path --lua-version 5.1 --bin)
            export PATH="/home/circleci/.local/bin:$PATH"
            # Run from project root so that plugin/hermes.lua path resolves correctly
            vusted --coverage -e "package.path = package.path .. ';./tests/lua/?.lua'; package.path = package.path .. ';./tests/lua/spec/?.lua'; package.path = package.path .. ';./lua/?.lua'; package.path = package.path .. ';./lua/?/init.lua'" tests/lua/spec/
      - run:
          name: Generate LCOV coverage report
          command: |
            eval $(luarocks path --lua-version 5.1 --bin)
            # Run from project root where luacov.stats.out was generated
            luacov -c tests/lua/.luacov -r lcov
            mv luacov.report.out lua.coverage.info
      - upload-coverage:
          file: lua.coverage.info

  lua_tests_0_11:
    environment:
      NEOVIM_VERSION: 0.11.6
      TERM: xterm-256color
      LANG: en_US.UTF-8
    executor: ubuntu
    steps:
      - checkout
      - attach_workspace:
          at: .
      - restore-cargo-cache
      - rust/install
      - run:
          name: Install Neovim from tarball
          command: |
            curl -LO https://github.com/neovim/neovim/releases/download/v${NEOVIM_VERSION}/nvim-linux-x86_64.tar.gz
            tar xzf nvim-linux-x86_64.tar.gz
            sudo mv nvim-linux-x86_64 /opt/nvim
            sudo ln -sf /opt/nvim/bin/nvim /usr/local/bin/nvim
            nvim --version
      - run:
          name: Build Hermes binary
          command: cargo build --release
      - run:
          name: Install Opencode
          command: curl -fsSL https://opencode.ai/install | bash
      - run:
          name: Install GitHub Copilot
          command: curl -fsSL https://gh.io/copilot-install | bash
      - run:
          name: Install Lua tools
          command: |
            # Install luarocks
            sudo apt-get update
            sudo apt-get install -y lua5.1 liblua5.1-dev

            wget https://luarocks.org/releases/luarocks-3.9.2.tar.gz
            tar zxpf luarocks-3.9.2.tar.gz
            cd luarocks-3.9.2
            ./configure && make && sudo make install

            # Install vusted for testing
            eval $(luarocks path --lua-version 5.1 --bin)
            luarocks --lua-version=5.1 install vusted --local
      - run:
          name: Run Lua tests
          command: |
            eval $(luarocks path --lua-version 5.1 --bin)
            export PATH="/home/circleci/.local/bin:$PATH"
            # Run from project root so that plugin/hermes.lua path resolves correctly
            vusted -e "package.path = package.path .. ';./tests/lua/?.lua'; package.path = package.path .. ';./tests/lua/spec/?.lua'; package.path = package.path .. ';./lua/?.lua'; package.path = package.path .. ';./lua/?/init.lua'" tests/lua/spec/
